<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário - Bootstrap</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-8 p-5">
          <h2>Formulário de contato</h2>
          <form>
            <label class="form-label mt-3" for="nome">Nome:</label>
            <input class="form-control" type="text" id="nome" />
            <label class="form-label mt-3" for="email">E-mail:</label>
            <input class="form-control" type="email" id="email" />
            <label for="telefone" class="form-label mt-3">Telefone:</label>
            <input type="tel" class="form-control" id="telefone">
            <button class="btn btn-success mt-3">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
