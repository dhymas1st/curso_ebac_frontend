<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de cadastro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="form-control">
          <label for="nome-completo">Nome completo:</label>
          <input type="text" id="nome-completo" placeholder="Digite o seu nome" />
        </div>
        <div class="form-control">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="Digite o seu e-mail" />
        </div>
        <div class="form-control">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" />
        </div>
        <div class="form-control">
          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" />
        </div>
      </fieldset>
      <fieldset>
        <legend>Endereço</legend>
        <div class="form-control">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" />
        </div>
        <div class="form-control">
          <label for="logradouro">Logradouro:</label>
          <input type="text" id="logradouro" placeholder="Ex: Rua Doutor Maldonado Costa " />
        </div>
        <div class="form-control">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" placeholder="Ex: Jardim Luzitano" />
        </div>
        <div class="form-control">
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" placeholder="Ex: Ribeirão Pires" />
        </div>
        <div class="form-control">
            <select id="estado" name="estado">
                <option value="">Selecione...</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
              </select>
        </div>
        <div class="form-control">
          <label for="numero">Número:</label>
          <input type="number" id="numero" placeholder="Digite o número de sua residência" />
        </div>
      </fieldset>
      <input type="submit" value="Enviar">
    </form>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/jquery.mask.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
