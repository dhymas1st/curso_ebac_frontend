<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integre HTML com Javascript - Validação de formulário</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="container">
        <h1>Verifique se o campo A é maior que o campo B</h1>
      <form id="form">
        <input type="number" id="campoA" placeholder="Campo A" />
        <input type="number" id="campoB" placeholder="Campo B" />
        <button type="submit">Verificar</button>
        <div id="message" class="message"></div>
      </form>
    </div>
    <script src="main.js"></script>
  </body>
</html>
